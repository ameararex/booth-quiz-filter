name: Que-Fil site deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: que-fil-catalog-update
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: npm ci
      - name: Configure database
        env:
          SHARES_DATABASE_ID: ${{ vars.SHARES_DATABASE_ID }}
        run: node scripts/configure-d1.mjs
      - name: Preserve currently published catalog
        env:
          CATALOG_SITE_URL: ${{ vars.CATALOG_SITE_URL || 'https://que-fil.ameararex.com' }}
        run: node scripts/prepare-baseline.mjs
      - run: npm run check
      - name: Apply pending D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply booth-quiz-shares --remote
      - name: Deploy site with preserved catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
