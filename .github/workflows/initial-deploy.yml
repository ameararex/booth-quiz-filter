name: Que-Fil initial deploy
on:
  workflow_dispatch:
    inputs:
      full_after_probe:
        description: '3ページ取得と初回デプロイに成功したら、そのまま全件取得・デプロイへ進む'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: que-fil-catalog-update
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Prevent initial deploy after automatic deployment is enabled
        env:
          ENABLE_CATALOG_DEPLOY: ${{ vars.ENABLE_CATALOG_DEPLOY }}
        run: test "$ENABLE_CATALOG_DEPLOY" != true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
      - run: npm ci
      - name: Configure database
        env:
          SHARES_DATABASE_ID: ${{ vars.SHARES_DATABASE_ID }}
        run: node scripts/configure-d1.mjs
      - run: npm run check
      - name: Collect first three pages and prepare catalog
        run: npm run collect:booth:three -- --publish
      - run: npm run build
      - name: Initialize D1 tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler d1 migrations apply booth-quiz-shares --remote
      - name: Deploy to custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
      - name: Collect all pages after successful initial deployment
        if: inputs.full_after_probe
        env:
          BOOTH_CACHE_MAX_AGE_HOURS: '6'
        run: npm run collect:booth
      - name: Validate and build full catalog
        if: inputs.full_after_probe
        run: npm run validate:catalog && npm run build
      - name: Deploy full catalog
        if: inputs.full_after_probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy
